{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container text-center py-5 my-5">
  <div class="display-1 fw-bold text-primary">404</div>
  <h2 class="mt-3 mb-2">Page Not Found</h2>
  <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('main.index') }}" class="btn tv-btn-primary px-4">Go Home</a>
  <a href="{{ url_for('main.destinations') }}" class="btn btn-outline-primary tv-btn-outline ms-2 px-4">Explore Destinations</a>
</div>
{% endblock %}
