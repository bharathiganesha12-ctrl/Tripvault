{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="container text-center py-5 my-5">

  <h2 class="mt-3 mb-2">Internal Server Error</h2>
  <p class="text-muted mb-4">Something went wrong on our end. Please try again shortly.</p>
  <a href="{{ url_for('main.index') }}" class="btn tv-btn-primary px-4">Go Home</a>
</div>
{% endblock %}
